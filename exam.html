<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基本情報技術者試験 模擬試験</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      max-width: 720px;
      width: 100%;
      overflow: hidden;
    }
    .header {
      background: #2563eb;
      color: white;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .progress-text { font-size: 14px; opacity: 0.85; }
    .progress-bar-wrap { background: #1d4ed8; height: 6px; }
    .progress-bar { height: 6px; background: #60a5fa; transition: width 0.4s ease; }
    .score-bar {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 28px;
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .score-bar span { font-weight: 600; }
    .correct-count { color: #16a34a; }
    .wrong-count { color: #dc2626; }
    .body { padding: 32px 28px; }
    .subject-badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .question-num { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .question-text { font-size: 17px; line-height: 1.7; color: #1e293b; margin-bottom: 12px; font-weight: 500; }
    .code-block {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      margin: 12px 0;
      overflow-x: auto;
      white-space: pre;
    }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; }
    th { background: #f8fafc; color: #475569; font-weight: 600; }
    .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .choice-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
      color: #1e293b;
      text-align: left;
      transition: all 0.15s;
      font-family: inherit;
    }
    .choice-btn:hover:not(:disabled) { border-color: #2563eb; background: #eff6ff; }
    .choice-btn .label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #2563eb;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .choice-btn:hover:not(:disabled) .label { background: #2563eb; color: white; }
    .choice-btn.correct { border-color: #16a34a; background: #f0fdf4; }
    .choice-btn.correct .label { background: #16a34a; color: white; }
    .choice-btn.wrong { border-color: #dc2626; background: #fef2f2; }
    .choice-btn.wrong .label { background: #dc2626; color: white; }
    .choice-btn.reveal { border-color: #16a34a; background: #f0fdf4; }
    .choice-btn.reveal .label { background: #16a34a; color: white; }
    .choice-btn:disabled { cursor: default; }
    .feedback {
      display: none;
      margin-top: 20px;
      border-radius: 10px;
      padding: 16px 18px;
      font-size: 14px;
      line-height: 1.7;
    }
    .feedback.correct { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .feedback.wrong { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .feedback-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .feedback table { margin: 8px 0; font-size: 13px; }
    .feedback th { background: rgba(0,0,0,0.04); }
    .next-btn {
      display: none;
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .next-btn:hover { background: #1d4ed8; }

    /* スタート画面 */
    .start-screen { padding: 40px 28px; text-align: center; }
    .start-screen h2 { font-size: 20px; color: #1e293b; margin-bottom: 8px; }
    .start-screen p { font-size: 14px; color: #64748b; margin-bottom: 32px; }
    .set-cards { display: flex; flex-direction: column; gap: 14px; }
    .set-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      background: white;
      font-family: inherit;
      transition: all 0.15s;
    }
    .set-card:hover { border-color: #2563eb; background: #eff6ff; }
    .set-card-info { display: flex; flex-direction: column; gap: 4px; }
    .set-card-title { font-size: 17px; font-weight: 700; color: #1e293b; }
    .set-card-desc { font-size: 13px; color: #64748b; }
    .set-card-arrow { font-size: 20px; color: #2563eb; }

    /* 結果画面 */
    .result-screen { display: none; text-align: center; padding: 40px 28px; }
    .result-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .result-circle.pass { background: #f0fdf4; border: 6px solid #16a34a; color: #16a34a; }
    .result-circle.fail { background: #fef2f2; border: 6px solid #dc2626; color: #dc2626; }
    .result-circle .big { font-size: 36px; }
    .result-circle .small { font-size: 13px; }
    .result-title { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
    .result-sub { font-size: 14px; color: #64748b; margin-bottom: 28px; }
    .result-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
    .result-table th, .result-table td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: center; }
    .result-table th { background: #f8fafc; color: #475569; }
    .result-table .pass-cell { color: #16a34a; font-weight: 700; }
    .result-table .fail-cell { color: #dc2626; font-weight: 700; }
    .result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .retry-btn {
      padding: 13px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .retry-btn:hover { background: #1d4ed8; }
    .back-btn {
      padding: 13px 28px;
      background: white;
      color: #2563eb;
      border: 2px solid #2563eb;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .back-btn:hover { background: #eff6ff; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: "Courier New", monospace; font-size: 13px; color: #1e293b; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>基本情報技術者試験　模擬試験</h1>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <div class="score-bar" id="scoreBar" style="display:none">
    正解：<span class="correct-count" id="correctCount">0</span>
    不正解：<span class="wrong-count" id="wrongCount">0</span>
    残り：<span id="remainCount">30</span>問
  </div>

  <!-- スタート画面 -->
  <div class="start-screen" id="startScreen">
    <h2>問題セットを選んでください</h2>
    <p>各セット 30問（科目A：20問 / 科目B：10問）</p>
    <div class="set-cards">
      <button class="set-card" onclick="startQuiz(0)">
        <div class="set-card-info">
          <div class="set-card-title">第1回　基礎セット</div>
          <div class="set-card-desc">数値表現・メモリ・OS・DB・ネットワーク・セキュリティ・OOP</div>
        </div>
        <div class="set-card-arrow">→</div>
      </button>
      <button class="set-card" onclick="startQuiz(1)">
        <div class="set-card-info">
          <div class="set-card-title">第2回　応用セット</div>
          <div class="set-card-desc">シフト演算・OSI・SQL JOIN・ACID・アジャイル・キュー・ハッシュ・ソート</div>
        </div>
        <div class="set-card-arrow">→</div>
      </button>
    </div>
  </div>

  <!-- 問題画面 -->
  <div class="body" id="quizBody" style="display:none">
    <div class="subject-badge" id="subjectBadge"></div>
    <div class="question-num" id="questionNum"></div>
    <div class="question-text" id="questionText"></div>
    <div id="questionExtra"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
  </div>

  <!-- 結果画面 -->
  <div class="result-screen" id="resultScreen"></div>
</div>

<script>
const questionSets = [

// ===== 第1回 =====
[
  {
    subject: "科目A",
    text: "2進数 <code>1011 0110</code> を16進数に変換した値はどれか。",
    choices: ["A6", "B6", "B5", "A5"],
    answer: 1,
    explanation: `<b>1011 0110</b> を4ビットずつ分割します。<br><br>
      <table><tr><th>2進数</th><th>計算</th><th>16進数</th></tr>
      <tr><td>1011</td><td>8+2+1=11</td><td>B</td></tr>
      <tr><td>0110</td><td>4+2=6</td><td>6</td></tr></table>
      よって <b>B6</b>`
  },
  {
    subject: "科目A",
    text: "2の補数方式で8ビットが表せる整数の範囲はどれか。",
    choices: ["−128 〜 127", "−127 〜 128", "−128 〜 128", "−127 〜 127"],
    answer: 0,
    explanation: `最上位ビットが符号ビットになります。<br><br>
      <table><tr><th>状態</th><th>ビット列</th><th>値</th></tr>
      <tr><td>最小値</td><td>1000 0000</td><td>−128</td></tr>
      <tr><td>最大値</td><td>0111 1111</td><td>+127</td></tr></table>`
  },
  {
    subject: "科目A",
    text: "次の論理式を簡略化したものはどれか。<br><br><code>A・B + A・B̄</code>",
    choices: ["A", "B", "A + B", "1"],
    answer: 0,
    explanation: `分配法則を適用します。<br><br>
      <b>A・B + A・B̄ = A・(B + B̄) = A・1 = A</b><br><br>
      <code>B + B̄ = 1</code>（補元の法則）なので残るのは <b>A</b> だけです。`
  },
  {
    subject: "科目A",
    text: "4ビットのリングカウンタが初期状態 <code>1000</code> のとき、クロックパルスを3回入力した後の状態はどれか。",
    choices: ["0001", "0010", "0100", "1000"],
    answer: 0,
    explanation: `リングカウンタは右にシフトし、最下位ビットが最上位へ循環します。<br><br>
      <table><tr><th>パルス</th><th>状態</th></tr>
      <tr><td>初期</td><td>1000</td></tr>
      <tr><td>1回目</td><td>0100</td></tr>
      <tr><td>2回目</td><td>0010</td></tr>
      <tr><td>3回目</td><td><b>0001</b></td></tr></table>`
  },
  {
    subject: "科目A",
    text: "キャッシュのヒット率0.9、キャッシュアクセス時間10 ns、主記憶アクセス時間100 ns のとき、実効アクセス時間は何 ns か。",
    choices: ["10", "19", "55", "100"],
    answer: 1,
    explanation: `実効アクセス時間 = ヒット率 × キャッシュ時間 + (1−ヒット率) × 主記憶時間<br><br>
      <b>= 0.9 × 10 + 0.1 × 100 = 9 + 10 = 19 ns</b>`
  },
  {
    subject: "科目A",
    text: "OSの仮想記憶管理においてスラッシングが発生する主な原因はどれか。",
    choices: ["CPUのクロック数が低い","物理メモリが不足し、ページの入替えが頻繁に発生する","ディスクの回転数が遅い","キャッシュメモリの容量が不足している"],
    answer: 1,
    explanation: `スラッシングとは、<b>物理メモリ不足</b>によってページフォールトが頻発し、ページの入替えに大半の時間が費やされ、実質的な処理が進まなくなる現象です。`
  },
  {
    subject: "科目A",
    text: "「ラウンドロビン方式」の説明として適切なものはどれか。",
    choices: ["優先度の高いプロセスを常に先に実行する","各プロセスに一定時間（タイムスライス）を割り当て、順番に実行する","最も短い実行時間のプロセスを優先して実行する","プロセスが完了するまで他のプロセスに切り替えない"],
    answer: 1,
    explanation: `<table><tr><th>方式</th><th>説明</th></tr>
      <tr><td>ラウンドロビン</td><td>タイムスライスを均等割当・順番実行（イ）</td></tr>
      <tr><td>優先度スケジューリング</td><td>優先度の高いプロセスを先に（ア）</td></tr>
      <tr><td>最短ジョブ優先(SJF)</td><td>実行時間が最短を優先（ウ）</td></tr>
      <tr><td>ノンプリエンプティブ</td><td>完了まで切り替えなし（エ）</td></tr></table>`
  },
  {
    subject: "科目A",
    text: "第3正規形（3NF）の条件として正しいものはどれか。",
    choices: ["第1正規形を満たし、すべての非キー属性が主キーに完全関数従属している","第2正規形を満たし、すべての非キー属性が主キーに推移的関数従属していない","繰り返し項目が存在しない","主キーが単一の属性で構成されている"],
    answer: 1,
    explanation: `<table><tr><th>正規形</th><th>条件</th></tr>
      <tr><td>1NF</td><td>繰り返し項目なし</td></tr>
      <tr><td>2NF</td><td>1NF + 部分関数従属なし</td></tr>
      <tr><td><b>3NF</b></td><td><b>2NF + 推移的関数従属なし</b></td></tr></table>`
  },
  {
    subject: "科目A",
    text: `次のSQL文を実行した結果として返される行数はどれか。<br>
      <div class="code-block">SELECT DISTINCT department FROM employees WHERE salary &gt; 400000;</div>
      <table><tr><th>department</th><th>salary</th></tr>
      <tr><td>営業</td><td>350,000</td></tr>
      <tr><td>開発</td><td>500,000</td></tr>
      <tr><td>開発</td><td>600,000</td></tr>
      <tr><td>人事</td><td>420,000</td></tr>
      <tr><td>営業</td><td>450,000</td></tr></table>`,
    choices: ["2行", "3行", "4行", "5行"],
    answer: 1,
    explanation: `<code>salary &gt; 400000</code> で絞ると：開発・開発・人事・営業 の4行。<br>
      <code>DISTINCT department</code> で重複排除：<b>開発・人事・営業</b> → <b>3行</b>`
  },
  {
    subject: "科目A",
    text: "TCPとUDPを比較した説明として適切なものはどれか。",
    choices: ["UDPはコネクション型プロトコルであり、信頼性の高い通信を行う","TCPはコネクションレス型で、リアルタイム通信に適している","TCPはコネクション型で信頼性の高い通信を行うが、UDPより遅延が大きくなる場合がある","UDPはフロー制御と輻輳制御を持ち、大容量データ転送に適している"],
    answer: 2,
    explanation: `<table><tr><th></th><th>TCP</th><th>UDP</th></tr>
      <tr><td>接続</td><td>コネクション型</td><td>コネクションレス型</td></tr>
      <tr><td>信頼性</td><td>保証あり</td><td>保証なし</td></tr>
      <tr><td>速度</td><td>遅延大きい</td><td>低遅延</td></tr>
      <tr><td>用途</td><td>Web・メール</td><td>動画・DNS・VoIP</td></tr></table>`
  },
  {
    subject: "科目A",
    text: "<code>192.168.10.0/24</code> のネットワークで使用可能なホストアドレスの数はどれか。",
    choices: ["253", "254", "255", "256"],
    answer: 1,
    explanation: `/24 = ホスト部8ビット = 2⁸ = 256アドレス<br><br>
      ネットワークアドレス（.0）とブロードキャスト（.255）を除くと <b>254ホスト</b>`
  },
  {
    subject: "科目A",
    text: "公開鍵暗号方式の説明として正しいものはどれか。",
    choices: ["暗号化と復号に同じ鍵を使用する","送信者は受信者の公開鍵で暗号化し、受信者は自分の秘密鍵で復号する","鍵の配送が共通鍵暗号方式より困難である","処理速度が共通鍵暗号方式より速い"],
    answer: 1,
    explanation: `<table><tr><th>手順</th><th>鍵</th></tr>
      <tr><td>暗号化（送信者）</td><td>受信者の<b>公開鍵</b></td></tr>
      <tr><td>復号（受信者）</td><td>自分の<b>秘密鍵</b></td></tr></table>
      処理速度は共通鍵より<b>遅い</b>です。`
  },
  {
    subject: "科目A",
    text: "デジタル署名の目的として適切なものはどれか。",
    choices: ["データの暗号化による盗聴防止","送信者の正当性（なりすまし防止）とデータの改ざん検出","データの圧縮による転送効率向上","不正アクセスの遮断"],
    answer: 1,
    explanation: `送信者が<b>秘密鍵</b>でハッシュ値を暗号化し、受信者が<b>公開鍵</b>で検証します。<br>
      目的：なりすまし防止・改ざん検出・否認防止`
  },
  {
    subject: "科目A",
    text: "オブジェクト指向における「継承」の説明として正しいものはどれか。",
    choices: ["オブジェクトの内部実装を隠蔽し、外部からはインターフェースのみを公開する","親クラスの属性や操作を子クラスが引き継ぐ仕組み","同一のメッセージに対してオブジェクトが異なる振る舞いをする","複数のオブジェクトを組み合わせて新しいオブジェクトを作る"],
    answer: 1,
    explanation: `<table><tr><th>概念</th><th>説明</th></tr>
      <tr><td>カプセル化</td><td>内部実装の隠蔽（ア）</td></tr>
      <tr><td><b>継承</b></td><td><b>親クラスの特性を子クラスが引き継ぐ（イ）</b></td></tr>
      <tr><td>ポリモーフィズム</td><td>同じメッセージへの異なる応答（ウ）</td></tr>
      <tr><td>集約</td><td>オブジェクトの組み合わせ（エ）</td></tr></table>`
  },
  {
    subject: "科目A",
    text: "「スパイラルモデル」の特徴として適切なものはどれか。",
    choices: ["要件定義→設計→実装→テストを一方向に進める","小さい単位で開発・評価を繰り返し、リスクを逐次管理しながら開発を進める","動作するソフトウェアを短いイテレーションで繰り返しリリースする","上流工程に戻ることができないため、要件の変更に弱い"],
    answer: 1,
    explanation: `<table><tr><th>開発モデル</th><th>特徴</th></tr>

const labels = ["ア", "イ", "ウ", "エ"];
let current = 0;
let correct = 0;
let wrong = 0;
let answered = false;
let activeSet = null;

function startQuiz(setIndex) {
  activeSet = questionSets[setIndex];
  current = 0; correct = 0; wrong = 0; answered = false;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("quizBody").style.display = "block";
  document.getElementById("scoreBar").style.display = "flex";
  render();
}

function render() {
  const q = activeSet[current];
  document.getElementById("subjectBadge").textContent = q.subject;
  document.getElementById("questionNum").textContent = `問${current + 1}`;
  document.getElementById("questionText").innerHTML = q.text;
  document.getElementById("questionExtra").innerHTML = "";
  document.getElementById("progressText").textContent = `問${current + 1} / ${activeSet.length}`;
  document.getElementById("progressBar").style.width = `${((current + 1) / activeSet.length) * 100}%`;
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("remainCount").textContent = activeSet.length - current;

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  q.choices.forEach((c, i) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="label">${labels[i]}</span><span>${c}</span>`;
    btn.onclick = () => selectAnswer(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById("feedback").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  answered = false;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;

  const q = activeSet[current];
  const btns = document.querySelectorAll(".choice-btn");
  btns.forEach(b => b.disabled = true);

  const isCorrect = idx === q.answer;
  if (isCorrect) { correct++; btns[idx].classList.add("correct"); }
  else { wrong++; btns[idx].classList.add("wrong"); btns[q.answer].classList.add("reveal"); }

  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;

  const feedback = document.getElementById("feedback");
  feedback.className = `feedback ${isCorrect ? "correct" : "wrong"}`;
  feedback.innerHTML = `
    <div class="feedback-title">${isCorrect ? "✅ 正解！" : `❌ 不正解　正解は <b>${labels[q.answer]}（${q.choices[q.answer]}）</b>`}</div>
    ${q.explanation}
  `;
  feedback.style.display = "block";

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.style.display = "block";
  nextBtn.textContent = current + 1 < activeSet.length ? "次の問題へ →" : "結果を見る";
}

function nextQuestion() {
  current++;
  if (current >= activeSet.length) showResult();
  else render();
}

function showResult() {
  document.getElementById("quizBody").style.display = "none";
  document.getElementById("scoreBar").style.display = "none";
  document.getElementById("progressBar").style.width = "100%";
  const resultEl = document.getElementById("resultScreen");
  resultEl.style.display = "block";

  const total = correct;
  const pct = Math.round((total / activeSet.length) * 100);
  const pass = pct >= 60;

  resultEl.innerHTML = `
    <div class="result-circle ${pass ? "pass" : "fail"}">
      <div class="big">${pct}%</div>
      <div class="small">${total} / ${activeSet.length}問</div>
    </div>
    <div class="result-title">${pass ? "合格圏内です！" : "もう少し復習しましょう"}</div>
    <div class="result-sub">合格ライン：正答率 60% 以上</div>
    <table class="result-table">
      <tr><th>問題数</th><th>正解</th><th>不正解</th><th>正答率</th><th>判定</th></tr>
      <tr>
        <td>${activeSet.length}問</td>
        <td class="pass-cell">${correct}</td>
        <td class="fail-cell">${wrong}</td>
        <td>${pct}%</td>
        <td class="${pass ? "pass-cell" : "fail-cell"}">${pass ? "合格圏" : "要復習"}</td>
      </tr>
    </table>
    <div class="result-btns">
      <button class="back-btn" onclick="goTop()">← 問題選択に戻る</button>
      <button class="retry-btn" onclick="retry()">もう一度挑戦する</button>
    </div>
  `;
}

function retry() {
  current = 0; correct = 0; wrong = 0; answered = false;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("scoreBar").style.display = "flex";
  document.getElementById("quizBody").style.display = "block";
  render();
}

function goTop() {
  activeSet = null;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("progressText").textContent = "";
  document.getElementById("progressBar").style.width = "0%";
  document.getElementById("startScreen").style.display = "block";
}
</script>
